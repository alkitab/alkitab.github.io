  <title>سورة الكافرون</title>
</head>
<body>
  <h1>سورة الكافرون</h1>

  <p style="color: #b8860b; font-size: 1.8em; line-height: 2;">
    بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ<br>
    قُلْ يَا أَيُّهَا الْكَافِرُونَ<br>
    لَا أَعْبُدُ مَا تَعْبُدُونَ<br>
    وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ<br>
    وَلَا أَنَا عَابِدٌ مَا عَبَدْتُمْ<br>
    وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ<br>
    لَكُمْ دِينُكُمْ وَلِيَ دِينِ
  </p>
</body>
</html>
